<title>Manual da Equipe Booga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: no estilo dos PDFs de pacotes — fundo creme, faixas azuis de cabeçalho, rótulos pequenos com traço, ícones de linha em círculos, cartões brancos leves.
   Visual único (não muda no tema escuro): é a identidade impressa das casas levada para o celular. */
:root{
  --bg:#FAF7EF; --card:#FFFFFF; --line:#ECE5D3; --ink:#1E1C3F; --muted:#6A6780;
  --navy:#232070; --navy-t:#ECEBF7; --green:#5E9A2A; --green-d:#4F8037; --green-t:#EEF5E2; --lime:#B5D615;
  --purple:#4A3A9C; --purple-t:#EFECFA; --orange:#EE6A1F; --orange-t:#FDEFE5; --red:#C9362B; --red-t:#FCEFED; --brown:#4A2109;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding-inline:18px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.disc{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--navy-t);color:var(--navy)}
.kick{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
.kick::before{content:"";width:16px;height:2px;background:currentColor;border-radius:2px}
h2.t{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.08;letter-spacing:-.01em;color:var(--navy);text-wrap:balance}
.lead{color:var(--muted);font-size:15.5px}
.small{font-size:13.5px;color:var(--muted)}

/* topo */
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--lime) 0 33%,var(--orange) 33% 66%,var(--green) 66%)}
.hgrid{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.htext{display:flex;flex-direction:column;gap:10px;min-width:0}
.glogo{width:104px;height:auto;align-self:center}
.jump{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:var(--lime);color:var(--navy);text-decoration:none;font-weight:800;font-size:14px;border-radius:999px;padding:9px 14px}
.jump .ic{width:16px;height:16px}
@media (min-width:480px){.glogo{width:140px}}
.hero .wrap{padding-block:28px 32px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.hero .lg{display:flex;gap:12px;align-items:center}
.hero .lg img{height:58px;width:auto}
.hero .kick{color:var(--lime)}
.hero h1{hyphens:none;font-family:var(--display);font-weight:800;font-size:31px;line-height:1.04;letter-spacing:-.015em;text-wrap:balance}
.hero p{font-size:16px;opacity:.85;max-width:36ch}

.sec{padding-block:30px 4px;display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:10px}

/* casas */
.house{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.house .band{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff}
.house .band img{height:48px;width:auto;background:#fff;border-radius:12px;padding:4px 6px}
.house .band .disc{background:rgba(255,255,255,.18);color:#fff}
.house h3{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1}
.house .addr{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:5px}
.house .addr .ic{width:14px;height:14px}
.house .feats{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:14px 16px}
.house .feats span{display:flex;gap:7px;align-items:center;font-size:13.5px;color:var(--ink)}
.house .feats .ic{width:16px;height:16px;color:var(--green)}
.entry{background:var(--green-t);border:1px solid #D9E8C2;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.entry .disc{background:var(--green);color:#fff}
.entry b{font-family:var(--display);font-size:17px;display:block;line-height:1.2;color:var(--green-d)}
.entry p{font-size:14.5px;color:var(--ink)}

/* guias */
.gbig{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--orange);color:#fff;border:0;border-radius:18px;padding:16px}
.gbig .disc{background:rgba(255,255,255,.22);color:#fff;width:48px;height:48px}
.gbig b{font-family:var(--display);font-weight:800;font-size:21px;display:block;line-height:1.1}
.gbig small{font-size:13.5px;opacity:.92}
.gbig > .ic{margin-left:auto}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fbtn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.fbtn:hover{border-color:var(--navy)}
.fbtn b{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.1;color:var(--navy)}

/* cartões */
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.rc .hd{display:flex;gap:12px;align-items:center}
.rc .hd img{height:42px;width:auto}
.rc h3{font-family:var(--display);font-weight:700;font-size:18.5px;line-height:1.2;color:var(--navy);flex:1;min-width:0;text-wrap:balance}
.rc .p{font-size:15px;color:var(--ink)}
.rc .ls{display:flex;flex-direction:column;gap:7px}
.rc .ls li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35}
.rc .ls li .ic{width:17px;height:17px;margin-top:2px;color:var(--green)}
.pill{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.k-red{background:var(--red-t);border-color:#F3D6D2}.k-red .disc{background:var(--red);color:#fff}.k-red h3{color:var(--red)}.k-red .pill{background:#fff;color:var(--red)}.k-red .ls li .ic{color:var(--red)}
.k-navy{background:var(--navy-t);border-color:#DCDAF0}.k-navy .disc{background:var(--navy);color:#fff}.k-navy .pill{background:#fff;color:var(--navy)}
.k-orange .disc{background:var(--orange-t);color:var(--orange)}.k-orange .pill{background:var(--orange-t);color:var(--orange)}
.k-bol{border-top:4px solid var(--purple)}.k-land{border-top:4px solid var(--green-d)}.k-soc{border-top:4px solid var(--green)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.k-red .two{border-color:#F3D6D2}
.two h4{margin:0 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.two .no h4{color:var(--red)}.two .yes h4{color:var(--green-d)}
.two p{display:flex;gap:6px;font-size:14px;line-height:1.3;margin-top:6px}
.two .no .ic{color:var(--red);width:15px;height:15px;margin-top:2px}.two .yes .ic{color:var(--green);width:15px;height:15px;margin-top:2px}
.tbl{display:flex;flex-direction:column}
.tbl div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.tbl div:last-child{border-bottom:0}
.tbl b{font-family:var(--display);font-weight:700;color:var(--navy);white-space:nowrap}
.tl{display:flex;flex-direction:column}
.tl > div{display:grid;grid-template-columns:66px 14px 1fr;gap:10px;padding-bottom:12px;position:relative}
.tl .w{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green);padding-top:3px;text-align:right}
.tl .d{width:10px;height:10px;border-radius:50%;background:var(--orange);margin-top:6px;position:relative;z-index:1}
.tl > div:not(:last-child)::after{content:"";position:absolute;left:80px;top:16px;bottom:-2px;width:2px;background:var(--line)}
.tl b{font-family:var(--display);font-weight:700;color:var(--navy);display:block;line-height:1.2}
.tl p{font-size:14px;color:var(--muted)}
.after{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}

/* consulta (bebidas, autismo) */
details{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px}
summary::-webkit-details-marker{display:none}
summary b{font-family:var(--display);font-weight:700;font-size:17px;color:var(--navy);display:block;line-height:1.2}
summary small{font-size:13px;color:var(--muted)}
summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
details[open] summary .chev{transform:rotate(90deg)}
.dc{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.dc h5{margin:6px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--green)}
.dc .ls{display:flex;flex-direction:column;gap:6px}
.dc .ls li{display:flex;gap:8px;line-height:1.35}
.dc .ls li .ic{width:16px;height:16px;margin-top:3px;color:var(--green)}
.drink{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.drink:last-of-type{border-bottom:0}
.drink b{font-family:var(--display);font-weight:700;color:var(--navy)}
.drink span{font-size:14px;color:var(--muted)}
.scale{display:flex;border-radius:10px;overflow:hidden;font-size:12px;font-weight:800;text-align:center}
.scale span{flex:1;padding:7px 2px;color:#fff}
.tip{background:var(--orange-t);border-radius:12px;padding:10px 12px;font-size:14px}
.tip b{color:var(--orange)}

/* marca do grupo, casas abertas, jeito booga, instagram */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.glogo{height:92px;width:auto}
.gw{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.18em;text-transform:uppercase;line-height:1.05;color:#fff}
.gw b{display:block;font-size:26px;letter-spacing:-.01em;text-transform:none;color:var(--lime)}
.mini{display:flex;gap:6px;align-items:center}
.mini img{height:38px;width:auto}
.about{font-size:16px;line-height:1.6;color:var(--ink)}
.about b{color:var(--navy)}
.house .txt{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;font-size:15.5px;line-height:1.55}
.house .nm{flex:1;min-width:0}
.igb{flex:none;display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:#fff;color:var(--navy);border-radius:999px;padding:7px 11px;font-weight:800;font-size:13px}
.igb .ic{width:16px;height:16px}
@media (max-width:430px){.igb span{display:none}.igb{padding:9px}}
.house .txt .small{display:flex;align-items:center;gap:6px}
.house .txt .small .ic{width:15px;height:15px}
.house details{border:0;border-top:1px solid var(--line);border-radius:0}
.house summary{padding:12px 16px}
.house summary b{font-size:15px}
.house .dc p{font-size:15px;line-height:1.5}
.insta{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;text-decoration:none;background:var(--navy);color:#fff;border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px}
.insta .ic{width:17px;height:17px}
.jeito{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jeito div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.jeito b{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2;color:var(--navy)}
.jeito p{font-size:13.5px;color:var(--muted);line-height:1.4}
.jeito .disc{width:36px;height:36px;background:var(--green-t);color:var(--green-d)}
.jeito .disc .ic{width:18px;height:18px}
.follow{background:var(--navy);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.follow b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.follow p{font-size:14.5px;opacity:.85}
.follow .row2{display:flex;flex-wrap:wrap;gap:8px}
.follow a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:#fff;color:var(--navy);border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px}
.follow a .ic{width:17px;height:17px}
.plain{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.plain .hd{display:flex;gap:12px;align-items:center}
.plain h3{font-family:var(--display);font-weight:800;font-size:21px;color:var(--navy)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 4px;font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--navy);color:#fff}
.tabp{display:flex;flex-direction:column;gap:10px}
.pg{display:flex;flex-direction:column;gap:14px}
.pg .kick{margin-top:14px}
.orow .ob.sup b{font-size:12px}
.orow .ob.sup span{font-size:11px}
.lab{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.mis{position:relative;background:var(--navy);color:#fff;border-radius:22px;padding:26px 20px 22px;overflow:hidden}
.mis .q{position:absolute;right:16px;top:4px;font-family:Georgia,serif;font-weight:700;font-size:96px;line-height:1;color:var(--lime);opacity:.9}
.mis .lab{color:var(--lime);margin-bottom:10px}
.mis p{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.32;letter-spacing:-.005em;max-width:30ch}
.vis2{display:flex;gap:14px;align-items:flex-start;background:var(--purple-t);border-radius:22px;padding:20px}
.vis2 .disc{background:var(--purple);color:#fff}
.vis2 .lab{color:var(--purple);margin-bottom:6px}
.vis2 p{font-family:var(--display);font-weight:600;font-size:17.5px;line-height:1.38;color:var(--ink)}
.vals{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px 18px 10px}
.vh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px}
.vh .lab{color:var(--green)}
.vrow{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.vn{font-family:var(--display);font-weight:800;font-size:38px;line-height:.9;color:var(--orange)}
.vb{display:flex;flex-direction:column;gap:8px;min-width:0}
.vb h3{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15;color:var(--navy)}
.vb p{font-size:15px;line-height:1.55;color:var(--ink)}
.vb .np span{display:flex;align-items:center;gap:5px}
.vb .np .ic{width:13px;height:13px}
.ctc{display:flex;gap:12px;align-items:flex-start;background:var(--green-t);border:1px solid #D9E8C2;border-radius:18px;padding:16px}
.ctc > div{display:flex;flex-direction:column;gap:8px;min-width:0}
.ctc b{font-family:var(--display);font-weight:700;font-size:17px;color:var(--navy)}
.ctc p{font-size:14.5px}
.tiles{display:flex;flex-direction:column;gap:8px}
.tile{display:grid;grid-template-columns:42px 1fr;column-gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile:hover{border-color:var(--navy)}
.tile .disc{grid-row:1/3}
.tile b{font-family:var(--display);font-weight:700;font-size:16.5px;color:var(--navy)}
.tile span{font-size:13.5px;color:var(--muted);line-height:1.3}
.mv{background:var(--navy);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.mv.vis{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.mvk{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
.mv.vis .mvk{color:var(--green)}
.mv p{font-family:var(--display);font-weight:600;font-size:18.5px;line-height:1.35}
h3.sub{font-family:var(--display);font-weight:800;font-size:21px;color:var(--navy);margin-top:6px}
.val{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.val .hd{display:flex;gap:12px;align-items:center}
.val h3{font-family:var(--display);font-weight:700;font-size:18.5px;line-height:1.2;color:var(--navy)}
.val h3 small{display:block;font-size:11px;letter-spacing:.14em;color:var(--orange);font-weight:800}
.val > p{font-size:15px;line-height:1.55}
.np{background:var(--green-t);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.4}
.np span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green-d);margin-bottom:2px}
.rc .vtag{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:var(--green-d)}
.rc .vtag .ic{width:14px;height:14px}
.ob{font:inherit;cursor:pointer}
.ob.sel{outline:2px solid var(--orange);outline-offset:2px}
.newrec{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:6px}
.newrec span{background:var(--purple-t);color:var(--purple);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800}
.newrec small{font-size:11.5px;color:var(--muted)}
.oteam{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.oteam .ob{padding:8px 2px}
.oteam .ob b{font-size:12.5px}
.oinfo{width:100%;margin-top:12px;background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:56px}
.oinfo b{font-family:var(--display);color:var(--navy)}
.oinfo p{font-size:14.5px;line-height:1.45}
.og{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px}
.og .ic{width:15px;height:15px}
.wab{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;text-decoration:none;background:#25A35A;color:#fff;border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px}
.wab .ic{width:17px;height:17px}
.vwheel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vcore{grid-column:1/-1;display:flex;gap:10px;align-items:center;justify-content:center;background:var(--navy);color:#fff;border-radius:14px;padding:12px}
.vcore .disc{background:rgba(255,255,255,.16);color:#fff}
.vcore b{font-family:var(--display);font-size:16px;line-height:1.15}
.vchip{display:flex;gap:8px;align-items:center;background:var(--green-t);border-radius:12px;padding:10px;font-weight:700;font-size:13.5px;line-height:1.2;color:var(--green-d)}
.vchip .ic{width:18px;height:18px;flex:none}
.vchip.v4{grid-column:1/-1;justify-content:center}
.org{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:0}
.ob{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;display:flex;flex-direction:column;gap:1px;min-width:0}
.ob b{font-family:var(--display);font-weight:700;font-size:14.5px;color:var(--navy);line-height:1.15}
.ob span{font-size:12px;color:var(--muted);line-height:1.25}
.ob.top{background:var(--navy);border-color:var(--navy)}.ob.top b,.ob.top span{color:#fff}
.ob.main{background:var(--orange);border-color:var(--orange)}.ob.main b,.ob.main span{color:#fff}
.ob.sup{border:1.5px dashed #B9B3D6;background:#fff}
.ob.rec{background:var(--purple-t);border-color:#D9D2F3;min-width:150px}
.ol{width:2px;height:16px;background:var(--navy)}
.orow{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;align-items:center;width:100%;position:relative}
.orow::before{content:"";position:absolute;left:12%;right:12%;top:50%;border-top:2px solid var(--line);z-index:0}
.ob.side{background:#fff}
.orow .ob{position:relative;z-index:1}
.onote{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:var(--orange);margin:10px 0 8px}
.onote .ic{width:15px;height:15px}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.org .small{margin-top:10px;text-align:center}
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.qrow:hover{border-color:var(--navy)}
.qrow > span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qrow b{font-family:var(--display);font-weight:700;font-size:16.5px;color:var(--navy)}
.qrow span span{font-size:14px;line-height:1.35}
.qrow small{font-size:12.5px;color:var(--muted)}
.qrow > .ic{color:var(--muted)}
.entrega{background:var(--bg);border-radius:12px;padding:12px}
.entrega h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--green-d)}
.entrega .ls{display:flex;flex-direction:column;gap:7px}
.entrega .ls li{display:flex;gap:8px;font-size:14.5px;line-height:1.35}
.entrega .ls li .ic{width:16px;height:16px;margin-top:2px;color:var(--green)}
/* páginas de guia */
.ghead{color:#fff}
.ghead .wrap{padding-block:14px 22px;display:flex;flex-direction:column;gap:12px}
.back{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;color:#fff}
.back .ic{width:16px;height:16px}
.ghead .row{display:flex;gap:14px;align-items:center}
.ghead .disc{width:56px;height:56px;background:rgba(255,255,255,.16);color:#fff}
.ghead .disc .ic{width:26px;height:26px}
.ghead h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.02;letter-spacing:-.015em}
.ghead .kick{color:var(--lime)}
.ghead p{font-size:15.5px;opacity:.88}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{background:#fff;color:var(--ink);border-radius:12px;padding:7px 11px;display:flex;flex-direction:column;font-size:13.5px;line-height:1.25;font-weight:700}
.facts small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none;border:0;border-radius:14px;padding:15px;font-family:var(--display);font-weight:700;font-size:17px;background:var(--navy);color:#fff}
.btn.alt{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn.go{background:var(--orange)}
.next{display:flex;flex-direction:column;gap:10px;padding-block:22px}
.foot{text-align:center;font-size:12.5px;color:var(--muted);padding-block:24px 40px}

/* quiz */
.qwrap{padding-block:22px 40px;display:flex;flex-direction:column;gap:12px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.qtext{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.2;color:var(--navy)}
.opt{text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:15.5px;font-weight:600;line-height:1.35}
.opt:hover{border-color:var(--navy)}
.opt.ok{background:var(--green-t);border-color:var(--green)}.opt.bad{background:var(--red-t);border-color:var(--red)}
.opt:disabled{cursor:default}
.fbk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
input[type=text]{font:inherit;font-size:17px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);width:100%}
input[type=text]:focus{border-color:var(--navy);outline:none}
.cert{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.cert::before{content:"";position:absolute;inset:8px;border:1px solid var(--lime);border-radius:14px;pointer-events:none}
.cert .lg{display:flex;gap:10px}.cert .lg img{height:46px;width:auto}
.cert .nm{font-family:var(--display);font-weight:800;font-size:28px;color:var(--navy);line-height:1.1}
.cert .fn{font-family:var(--display);font-weight:700;font-size:20px;color:var(--orange)}
.cert code{font-size:13px;background:var(--bg);border-radius:8px;padding:4px 10px}
</style>

function rc(c){
 const k=c.k||"white";
 if(k==="plain")return `<div class="plain"><div class="hd">${disc(c.i)}<h3>${c.h}</h3></div>${c.p?`<p class="small">${c.p}</p>`:""}${c.html||""}</div>`;

 h+=`<div class="hd">${c.logo?`<img src="${c.logo}" alt="">`:disc(c.i)}<h3>${c.h}</h3></div>`;
 if(c.p)h+=`<p class="p">${c.p}</p>`;
 if(c.ls)h+=`<ul class="ls">${c.ls.map(t=>`<li>${ic(k==="red"?"alert-triangle":"check")}<span>${t}</span></li>`).join("")}</ul>`;

 if(c.tbl)h+=`<div class="tbl">${c.tbl.map(([n,v])=>`<div><span>${n}</span><b>${v}</b></div>`).join("")}</div>`;
 if(c.tl)h+=`<div class="tl">${c.tl.map(([w,t,p])=>`<div><span class="w">${w}</span><span class="d"></span><div><b>${t}</b><p>${p}</p></div></div>`).join("")}</div>`;
 if(c.after)h+=`<p class="after">${c.after}</p>`;

G.sobre={n:"Quem somos",i:"heart",bg:"var(--purple)",sub:"O grupo, a missão e os nossos valores.",html:()=>`
 <span class="kick">Quem somos</span><h2 class="t">O que é o Grupo Boogabol?</h2>
 <p class="about">Há 8 anos fazendo festa em Santa Cruz do Sul. Hoje somos três casas: o <b>Boogabol</b>, a <b>BoogaLand</b> e o <b>Boogabol Society</b>.</p>
 <p class="about">Cada casa tem o seu jeito. Em todas, o cuidado é o mesmo: criança brincando de verdade, família bem recebida e comida feita pela nossa equipe.</p>
 <p class="about">A equipe é uma só. Quando tu trabalha com a gente, tu representa as três.</p>


 <span class="kick">Missão, visão e valores</span><h2 class="t">O que a gente quer entregar</h2>
 <p class="lead">É isso que queremos entregar em cada encontro. E cada pessoa da equipe ajuda a fazer acontecer.</p>
 <div class="mis"><span class="q">“</span><span class="lab">Nossa missão</span><p>Criar momentos de alegria e encontro, em que brincar, celebrar e estar junto se transformem em lembranças queridas, com cuidado para que cada pessoa se sinta parte da festa.</p></div>
 <div class="vis2">${disc("eye")}<div><span class="lab">Nossa visão</span><p>Ser referência em Santa Cruz do Sul pela forma de receber, cuidar e celebrar, fazendo parte da história das famílias e dos encontros que elas querem viver de novo.</p></div></div>
 <div class="vals"><div class="vh"><span class="lab">Nossos valores</span><span class="small">5 jeitos de fazer festa</span></div>
 ${VALORES.map(([i,t,x,p],n)=>`<div class="vrow"><div class="vn">${n+1}</div><div class="vb"><h3>${t}</h3><p>${x}</p><div class="np"><span>${ic("check")}Na prática</span>${p}</div></div></div>`).join("")}</div>
`};

 <div class="hgrid"><div class="htext"><span class="kick">Manual da equipe</span>
 <h1>Boas-vindas à equipe!</h1>
 <p>8 anos de festa em Santa Cruz do Sul. Três casas, uma equipe.</p>

</div></header>

 <div class="entry">${disc("door-open")}<div><b>Entrada da equipe: Av. Paul Harris, 70</b><p>Corredor branco, em frente à Brigada. Vale para as três casas. Fechado? Tenta pela frente ou liga.</p></div></div>
</section>

<section class="sec" id="guias">
 <span class="kick">Teu guia</span><h2 class="t">Por onde começar?</h2>

 <p class="lead">Depois, abre o guia da tua função:</p>

<section class="sec" id="contato">
 <div class="ctc">${disc("message-circle")}<div><b>Ficou com dúvida ou aconteceu algo?</b><p>Chama a Vanessa no WhatsApp: (51) 99936-0408</p>${wa("vanessa","Chamar a Vanessa")}</div></div>

 <span class="kick">Conheça mais</span><h2 class="t">Antes da primeira festa</h2>
 <div class="tiles">
  <button class="tile" type="button" data-g="regras">${disc("shield-check")}<b>Regras e conduta</b><span>O que pode, o que não pode e o que fazer quando algo acontece</span></button>
  <button class="tile" type="button" data-g="sobre">${disc("heart")}<b>Quem somos</b><span>O grupo, a missão e os nossos valores</span></button>
  <button class="tile" type="button" data-g="org">${disc("users")}<b>Quem coordena</b><span>Organograma e quem faz o quê</span></button>
 </div>
</section>
</main>
<p class="foot">Grupo Boogabol · Boogabol · BoogaLand · Boogabol Society<br>Manual da Equipe · atualizado em ${ATUALIZADO}</p>`;
 app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>openGuide(b.dataset.g));
 if(scrollTo){const el=document.getElementById(scrollTo);if(el)el.scrollIntoView({block:"start"})}else window.scrollTo(0,0);
}

/* ---------- página de guia ---------- */
function openGuide(k){
 const g=G[k];
 app.innerHTML=`
<header class="ghead" style="background:${g.bg}"><div class="wrap">
 <button class="back" type="button" id="bk">${ic("arrow-left")}Início</button>
 <div class="row">${disc(g.i)}<div><span class="kick">${FUNCS.includes(k)?"Guia da função":"Para todo mundo"}</span><h1>${g.n}</h1></div></div>
 <p>${g.sub}</p>
 ${g.facts?`<div class="facts">${g.facts.map(([s,b])=>`<span><small>${s}</small>${b}</span>`).join("")}</div><p class="small" style="color:#fff;opacity:.75">Os horários de cada festa vão sempre pelo WhatsApp. Se a festa tiver hora extra, ela é paga.</p>`:""}
</div></header>
<main class="wrap" style="padding-top:20px">
 ${g.html?`<div class="pg">${g.html()}</div>`:`<div class="stack">${g.cards.map(rc).join("")}</div>`}
 ${g.extra?`<section class="sec"><span class="kick">Para consultar</span><h2 class="t">${g.extra.t}</h2>${g.extra.html}</section>`:""}
 <div class="next">
 ${g.quiz?`<button class="btn go" type="button" id="qz">Fazer o quiz de ${g.n} ${ic("arrow-right")}</button>`:`<p class="lead" style="text-align:center">Agora abre o guia da tua função:</p><div class="fgrid">${FUNCS.map(f=>`<button class="fbtn" type="button" data-g="${f}">${disc(G[f].i)}<b>${G[f].n}</b></button>`).join("")}</div>`}
 <button class="btn alt" type="button" id="bk2">${ic("arrow-left")}Voltar ao início</button>
 </div>
</main>
<p class="foot">Manual da Equipe · atualizado em ${ATUALIZADO}</p>`;
 document.getElementById("bk").onclick=()=>home(FUNCS.includes(k)||k==="geral"?"guias":"mais");
 document.getElementById("bk2").onclick=()=>home(FUNCS.includes(k)||k==="geral"?"guias":"mais");
 const qz=document.getElementById("qz");if(qz)qz.onclick=()=>quizStart(k);
 app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>openGuide(b.dataset.g));
 window.scrollTo(0,0);
}

/* ---------- quiz (opções embaralhadas) ---------- */
let Q=null;
const shuf=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function qshell(inner){const g=G[Q.k];app.innerHTML=`<header class="ghead" style="background:${g.bg}"><div class="wrap"><button class="back" type="button" id="bk">${ic("arrow-left")}Voltar ao guia</button><div class="row">${disc("trophy")}<div><span class="kick">Quiz</span><h1 style="font-size:28px">${g.n}</h1></div></div></div></header><main class="wrap qwrap">${inner}</main>`;document.getElementById("bk").onclick=()=>openGuide(Q.k);window.scrollTo(0,0)}
function quizStart(k){
 Q={k};let nome="";try{nome=localStorage.getItem("booga_nome")||""}catch(e){}
 qshell(`<p class="qtext">Qual é o teu nome?</p><p class="lead">Do jeito que tu quer no certificado.</p><input id="qn" type="text" autocomplete="name" placeholder="Nome e sobrenome" value="${esc(nome)}"><p class="small" id="qe" hidden>Escreve teu nome para continuar.</p><button class="btn go" type="button" id="qg">Começar</button>`);
 document.getElementById("qg").onclick=()=>{const v=document.getElementById("qn").value.trim();if(v.length<3){document.getElementById("qe").hidden=false;return}
  try{localStorage.setItem("booga_nome",v)}catch(e){}
  const list=[...G[k].quiz,...QGERAL];Q={k,nome:v,list,queue:list.map((_,i)=>i),pos:0,wrong:[],ok:0};ask()};
}
function ask(){
 const q=Q.list[Q.queue[Q.pos]];
 const order=shuf(q.o.map((_,j)=>j));
 qshell(`<div class="bar"><i style="width:${Math.round(Q.ok/Q.list.length*100)}%"></i></div><span class="small">Pergunta ${Q.pos+1} de ${Q.queue.length}</span><p class="qtext">${q.q}</p>${order.map(j=>`<button class="opt" type="button" data-j="${j}">${q.o[j]}</button>`).join("")}<div id="fbk"></div>`);
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const ok=+b.dataset.j===q.c;
  app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.j===q.c)x.classList.add("ok")});
  if(ok)Q.ok++;else{b.classList.add("bad");Q.wrong.push(Q.queue[Q.pos])}
  const last=Q.pos===Q.queue.length-1;
  document.getElementById("fbk").innerHTML=`<p class="fbk"><b>${ok?"Isso!":"Não é bem assim."}</b> ${q.x}</p><button class="btn" type="button" id="qx" style="margin-top:12px">${last?"Continuar":"Próxima"} ${ic("arrow-right")}</button>`;
  document.getElementById("qx").onclick=()=>{
   if(!last){Q.pos++;ask();return}
   if(Q.wrong.length){Q.queue=Q.wrong;Q.wrong=[];Q.pos=0;qshell(`<p class="qtext">Quase lá!</p><p class="lead">Faltou ${Q.queue.length===1?"1 pergunta":Q.queue.length+" perguntas"}. Agora tu já sabe a resposta.</p><button class="btn go" type="button" id="rt">Refazer</button>`);document.getElementById("rt").onclick=ask;return}
   cert();
  };
 });
}
function cert(){
 const g=G[Q.k],d=new Date(),dt=d.toLocaleDateString("pt-BR");
 let h=0;for(const ch of Q.nome+dt+Q.k)h=(h*31+ch.charCodeAt(0))>>>0;
 const cod=`BG-${Q.k.slice(0,3).toUpperCase()}-${String(d.getDate()).padStart(2,"0")}${String(d.getMonth()+1).padStart(2,"0")}-${h.toString(36).toUpperCase().slice(-4)}`;
 const msg=`Oi, Vanessa! Concluí o Manual da Equipe Booga.\nNome: ${Q.nome}\nFunção: ${g.n}\nData: ${dt}\nCódigo: ${cod}`;
 qshell(`<div class="cert"><div class="lg"><img src="${GRPN}" alt="Grupo Boogabol" style="height:70px"></div><span class="kick">Certificado</span><span class="nm">${esc(Q.nome)}</span><p>concluiu o Manual da Equipe como</p><span class="fn">${g.n}</span><p class="small">${dt}</p><code>${cod}</code></div>
 <a class="btn go" href="https://wa.me/5551999360408?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Enviar para a Vanessa</a>
 <button class="btn alt" type="button" id="cp">Copiar a mensagem</button>
 <p class="small" id="cpm">Tira um print desta tela também.</p>`);
 document.getElementById("cp").onclick=()=>{const ok=()=>{document.getElementById("cpm").textContent="Copiado! Agora cola na conversa com a Vanessa."};
  const fb=()=>{const t=document.createElement("textarea");t.value=msg;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){}t.remove()};
  navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(msg).then(ok,fb):fb()};
}
home();
</script>
